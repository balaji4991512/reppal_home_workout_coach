<title>RepPal prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: quiet monochrome. Hairlines instead of boxes, ink as the only accent, one sticky top bar, left menu (drawer on phones, column on wide screens). */
:root{--bg:#fff;--card:#fff;--fg:#111;--mut:#6b6b68;--bd:#e6e6e3;--acc:#111;--on:#fff;--accs:#f2f2f0;--ok:#157a55;--oks:#eaf5ef;--bad:#c4372c;--soft:#f5f5f3;--bar:#fff;--scrim:rgba(0,0,0,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f0f10;--card:#0f0f10;--fg:#f2f2f0;--mut:#9a9a96;--bd:#2a2a2c;--acc:#f2f2f0;--on:#0f0f10;--accs:#1c1c1e;--ok:#4cc79a;--oks:#14291f;--bad:#ff8a7d;--soft:#1a1a1c;--bar:#0f0f10;--scrim:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f0f10;--card:#0f0f10;--fg:#f2f2f0;--mut:#9a9a96;--bd:#2a2a2c;--acc:#f2f2f0;--on:#0f0f10;--accs:#1c1c1e;--ok:#4cc79a;--oks:#14291f;--bad:#ff8a7d;--soft:#1a1a1c;--bar:#0f0f10;--scrim:rgba(0,0,0,.6)}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;margin:32px 0 6px;font-weight:600}
p{margin:6px 0}
button{font-family:inherit}
.mut{color:var(--mut);font-size:14px}
.main{min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;min-height:56px;background:var(--bar);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ib{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--fg);cursor:pointer;flex:none}
.ib:hover{background:var(--soft)}
.ib svg,.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1}
.logo{display:block;flex:none}
.ttl{display:none;font-size:17px;font-weight:600}
.page{max-width:600px;margin:0 auto;padding-block:12px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.side{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(300px,86vw);display:flex;flex-direction:column;gap:14px;background:var(--card);border-right:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.open .side{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s;box-shadow:0 0 40px rgba(0,0,0,.18)}
.scrim{position:fixed;inset:0;z-index:35;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.open .scrim{opacity:1;pointer-events:auto}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 2px 6px}
.tag{margin:0 6px;color:var(--mut);font-size:14px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--mut);font:500 15px Inter,sans-serif;text-align:left;cursor:pointer}
.nav:hover{background:var(--soft)}
.nav[aria-current="page"]{background:var(--accs);color:var(--fg);font-weight:600}
#nav{display:flex;flex-direction:column;gap:2px}
.sfoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--bd);color:var(--mut);font-size:14px}
.sfoot b{display:block;color:var(--fg);font-size:15px}
.themes{display:flex;gap:6px;margin:12px 0 4px}
.themes .chip{flex:1;min-height:38px;padding:6px 8px;font-size:14px}
.leave{background:var(--soft);border-radius:12px;padding:12px}
.leave p{margin:0 0 8px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{margin-top:0;min-height:44px;font-size:15px}
@media(min-width:860px){.side{transform:none;visibility:visible;box-shadow:none;transition:none;width:248px}.scrim{display:none}.main{margin-left:248px}.ib.m,.bar .brand,.sh .x{display:none}.ttl{display:block;padding-left:max(20px,env(safe-area-inset-left,0px))}.bar{padding-left:0}}
@media(prefers-reduced-motion:reduce){.side,.scrim{transition:none}}
.card{background:transparent;border:0;border-radius:0;padding:0;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}
.row>div:first-child{min-width:0}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--mut);font-size:14px}
.r{font-size:16px;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 14px;font:500 15px Inter,sans-serif;cursor:pointer;min-height:44px}
.chip.on{border-color:var(--acc);background:var(--acc);color:var(--on)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--acc);color:var(--on);font:600 16px Inter,sans-serif;padding:14px;margin-top:14px;cursor:pointer;min-height:52px}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.big{font-size:76px;line-height:.95;font-weight:700;letter-spacing:-.03em}
.tgt{display:flex;align-items:baseline;gap:10px}
.tgt span{font-size:17px;color:var(--mut)}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:12px;padding:13px;font:16px Inter,sans-serif}
.inrow{display:flex;gap:8px}
.inrow .chip{flex:none}
pre{background:var(--soft);border-radius:10px;padding:10px;font-size:13px;overflow-x:auto;margin:8px 0}
.err{color:var(--bad);font-weight:600}
.up{color:var(--ok);font-weight:600}
.dots{display:flex;gap:6px;margin:0 0 14px}
.dots i{flex:1;height:3px;border-radius:2px;background:var(--bd)}
.dots i.d{background:var(--fg)}.dots i.c{background:var(--mut)}
.plate{min-width:52px;text-align:center}
.sets{display:flex;gap:8px;margin:14px 0 2px}
.sp{display:grid;place-items:center;min-width:56px;height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--bd);color:var(--mut);font:600 15px Inter,sans-serif}
.sp.d{background:var(--accs);border-color:transparent;color:var(--fg)}
.sp.c{border-color:var(--fg);color:var(--fg)}
.welcome{display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-bottom:6px}
.welcome p{margin:0;font-size:17px;max-width:30ch;color:var(--mut)}
.who{display:flex;align-items:center;gap:14px}
.av{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--on);font:700 24px Inter,sans-serif;flex:none}
.hero{padding:6px 0 4px}
.hero p{margin:6px 0 0}
.hero .hm{font-size:14px;color:var(--mut)}
.seg{display:flex;gap:6px;margin-top:16px}
.seg i{flex:1;height:3px;border-radius:2px;background:var(--bd)}
.seg i.d{background:var(--fg)}
.day{border:0;border-top:1px solid var(--bd);border-radius:0;background:none;margin:0}
.day:last-of-type{border-bottom:1px solid var(--bd)}
.day summary,.rest{display:flex;align-items:center;gap:12px;padding:8px 0;min-height:58px}
.day summary{cursor:pointer;list-style:none;font-weight:600}
.day summary::-webkit-details-marker{display:none}
.day summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(45deg);margin:0 4px 4px 2px;flex:none}
.day[open] summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.day .db{padding:0 0 10px}
.dd{width:44px;font-size:15px;font-weight:600;color:var(--mut);flex:none}
.dn{flex:1;min-width:0}
.dn small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.rest{color:var(--mut);min-height:46px;border-top:1px solid var(--bd)}
.pill{font:500 12px Inter,sans-serif;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}
.pill.next{background:var(--fg);color:var(--bg)}
.fold{margin-top:24px;border-top:1px solid var(--bd)}
.fold>summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;font-size:17px;min-height:56px;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(45deg);margin-right:6px}
.fold[open]>summary::after{transform:rotate(-135deg)}
details.h summary{cursor:pointer;font-weight:600;min-height:32px}
.swr{display:flex;align-items:center;gap:6px}
.swi{flex:none;width:32px;height:32px;margin:-6px -6px -6px 0;border:0;border-radius:8px;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
.swi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.swi.on{background:var(--bd);color:var(--fg)}
.sc{padding:4px 0 6px}
.sh2{display:flex;align-items:baseline;gap:10px}
.sh2 b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.sh2 span{font-size:15px;font-weight:600}
.bar2{height:4px;border-radius:2px;background:var(--bd);margin:8px 0 6px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--fg);border-radius:2px}
.sp2{margin:0 0 6px;font-size:14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}
.srow>div{min-width:0}
.srow .sn{display:block;font-weight:500}
.srow small{display:block;color:var(--mut);font-size:14px}
.srow .st{flex:none;font-size:14px;font-weight:600}
.sumln{font-weight:600;margin:0 0 10px}
.lnk{background:none;border:0;padding:6px 0 0;color:var(--mut);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;min-height:32px}
.swp{padding:4px 0 14px;border-bottom:1px solid var(--bd)}
.chip.sm{min-height:38px;padding:6px 11px;font-size:14px}
.cd{border-top:1px solid var(--bd);padding:10px 0 4px}
.cd b{font-weight:600}
.how li{margin:0 0 12px}
.how ul{padding-left:20px;margin:6px 0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:54px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font:600 16px Inter,sans-serif;cursor:pointer;margin-top:24px}
.gbtn svg{width:20px;height:20px;flex:none}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px;margin:18px 0 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}
.auth .side,.auth .bar,.auth .scrim{display:none}
.auth .main{margin-left:0}
.auth-wrap{max-width:420px;margin:0 auto;padding-top:6vh}
.field{display:block;margin:12px 0 6px;font-weight:600}
.eh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:0 -8px}
.eh h1{font-size:22px;text-align:center;font-weight:700}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-top:10px}
.tab{flex:1;min-height:46px;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mut);font:500 15px Inter,sans-serif;cursor:pointer}
.tab.on{color:var(--fg);font-weight:600;border-color:var(--fg)}
.ch h2{margin:26px 0 2px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{fill:var(--mut);font:12px Inter,sans-serif}
.chart .gr{stroke:var(--bd);stroke-width:1}
.chart .ln{stroke:var(--fg);fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--fg)}
.empty{padding:28px 0;text-align:center}
.rs{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:15px 0;border-top:1px solid var(--bd)}
.rs .d{color:var(--mut);font-size:15px}
.rs small{color:var(--mut)}
.prb{font:600 12px Inter,sans-serif;padding:4px 9px;border-radius:6px;background:var(--accs);color:var(--fg)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:8px 0;border:0;border-top:1px solid var(--bd);background:none;color:var(--fg);font:600 16px Inter,sans-serif;text-align:left;cursor:pointer}
.li small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.li svg{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px;color:var(--mut)}
</style>
<div id="shell" class="shell">
<aside id="side" class="side" aria-label="Main menu">
<div class="sh"><div class="brand" id="sbrand"></div><button class="ib x" onclick="menu(false)" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<p class="tag">Progressive overload, set by set.</p>
<nav id="nav" aria-label="Screens"></nav>
<div class="sfoot" id="sfoot"></div>
</aside>
<div class="scrim" onclick="menu(false)"></div>
<div class="main">
<header class="bar"><button class="ib m" id="mb" onclick="menu()" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="brand" id="hbrand"></div><div class="ttl" id="ttl"></div></header>
<main id="app" class="page"></main>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const LOGO=(z=36)=>`<svg class="logo" width="${z}" height="${z}" viewBox="0 0 40 40" role="img" aria-label="RepPal logo"><rect width="40" height="40" rx="11" fill="var(--acc)"/><g fill="var(--on)"><rect x="4" y="16" width="3.5" height="8" rx="1.5"/><rect x="8.5" y="13" width="4.5" height="14" rx="2"/><rect x="13" y="18.6" width="14" height="2.8" rx="1.4"/><rect x="27" y="10" width="4.5" height="20" rx="2"/><rect x="32.5" y="7" width="3.5" height="26" rx="1.5"/></g></svg>`;
const IC={cal:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',db:'<path d="M6.5 8v8M3.5 10v4M17.5 8v8M20.5 10v4M6.5 12h11"/>',user:'<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',sl:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',i:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2"/>',ch:'<path d="M4 19V5M4 19h16M8 15l4-5 3 3 4-6"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',go:'<path d="M9 6l6 6-6 6"/>',out:'<path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9M15 8l4 4-4 4M19 12H9"/>'};
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GG='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const TITLES={prog:'Progress',ex:'',auth:'',setup:'Your plan',week:'This week',plan:'Workout',log:'Workout',done:'Workout done',profile:'History and profile',how:'How it works'};
function chrome(){const items=[['week','This week','cal'],['today','Today’s workout','db'],['prog','Progress','ch'],['profile','History and profile','user'],['setup','Equipment and plan','sl'],['how','How it works','i']].filter(([k])=>S.started||k=='setup'||k=='how');
const act=S.v=='log'||S.v=='plan'?'today':S.v=='done'?'week':S.v=='ex'?'prog':S.v;
const brand=LOGO(36)+'<span>RepPal</span>';
$('#sbrand').innerHTML=brand;$('#hbrand').innerHTML=brand;$('#ttl').textContent=TITLES[S.v]||'';
$('#nav').innerHTML=(S.cf?`<div class="leave" role="alert"><p>Leave this workout? Sets you logged will be lost.</p><div class="two"><button class="btn alt" onclick="menu(false)">Stay</button><button class="btn" onclick="leave()">Leave</button></div></div>`:'')+items.map(([k,l,ic])=>`<button class="nav" ${act==k?'aria-current="page"':''} onclick="nav('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[ic]}</svg>${l}</button>`).join('');
const lv={beginner:'Beginner',intermediate:'Intermediate',advanced:'Advanced'}[S.lvl];
$('#sfoot').innerHTML=`<b>${esc(S.name||'Your plan')}</b>${S.user?esc(S.user.email):'Guest'}<br>${S.started?lv+', '+S.days+' day'+(S.days==1?'':'s')+' a week':'Set up your plan to begin.'}<div class="themes" role="group" aria-label="Colour theme">${[['light','Light'],['dark','Dark'],['system','Auto']].map(([k,l])=>`<button class="chip ${S.theme==k?'on':''}" aria-pressed="${S.theme==k}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div><button class="nav" style="margin-top:4px;padding-left:0" onclick="${S.user?'signOut()':'nav(\'auth\')'}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC.out}</svg>${S.user?'Sign out':'Sign in'}</button>`;
const sh=$('#shell');if(sh&&sh.classList){sh.classList.toggle('open',!!S.menu);sh.classList.toggle('auth',S.v=='auth')}
const mb=$('#mb');if(mb&&mb.setAttribute)mb.setAttribute('aria-expanded',S.menu?'true':'false')}
function vAuth(){return `<div class="auth-wrap"><div class="welcome">${LOGO(72)}<h1>RepPal</h1><p>Sign in to keep your plan and workout history.</p></div>
${S.gs?`<form class="card" onsubmit="signIn(event)"><h2 style="margin-top:0">Continue with Google</h2><p class="mut">This prototype does not connect to Google. Enter your Gmail address to see the signed-in experience. It stays on this device and no password is asked for.</p><label class="field" for="gm">Gmail address</label><input type="text" id="gm" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="name@gmail.com" value="${esc(S.gm)}" oninput="S.gm=this.value">${S.ge?`<p class="err" role="alert">${S.ge}</p>`:''}<button class="btn" type="submit">Continue</button><button class="btn alt" type="button" onclick="S.gs=false;S.ge='';render()">Cancel</button></form>`:`<button class="gbtn" onclick="S.gs=true;render();const g=$('#gm');if(g&&g.focus)g.focus()">${GG}Continue with Google</button>`}
<div class="or">or</div>
<button class="btn alt" style="margin-top:14px" onclick="guest()">Try without an account</button>

<h2>Where you are now</h2>${done.length?`<div class="card">${done.map(id=>`<div class="row"><div>${EX[id].n}</div><div class="r">${presc(id)}</div></div>`).join('')}</div><p class="mut">These are the targets for your next session of each exercise.</p>`:'<p class="mut">Finish a workout and your current targets show up here.</p>'}
<h2>Workout history</h2>${H.length?H.map(h=>`<div class="card"><details class="h"><summary>${NAME[h.label]||h.label}${h.date?', '+fmtD(h.date):''}<small class="mut" style="display:block;font-weight:400">${h.tot?Math.round(h.tot)+' kg':''}${h.tot&&h.totr?', ':''}${h.totr?h.totr+' bodyweight reps':''}</small></summary>${h.plan?sessCard(h):''}</details></div>`).join(''):'<p class="mut">No workouts yet.</p>'}

const RANGES=[['1W',7,'1 week'],['1M',30,'1 month'],['3M',91,'3 months'],['6M',182,'6 months'],['1Y',365,'1 year'],['All',0,'All time']];
const fmtMD=d=>{try{return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}catch(e){return ''}};
function demoFor(id){const e=EX[id],a=[4,5,6,8,10,12,14,16],out=[],n=13,now=Date.now();let w=e.bw?0:(e.w0||8),t=8;
for(let i=0;i<n;i++){const d=new Date(now-((n-1-i)*7+2)*864e5);if(i&&i%4==0&&!e.bw){const nx=a.find(x=>x>w);if(nx){w=nx;t=8}}else t=Math.min(e.bw?15:12,t+1);if(i==7)t=Math.max(8,t-3);
const sets=[t,t,Math.max(6,t-1)].map(r=>({reps:r,w,e:r<t?'hard':'just right'}));out.push({date:d,vol:e.bw?sets.reduce((x,y)=>x+y.reps,0):sets.reduce((x,y)=>x+y.reps*y.w,0),sets})}return out}
function histFor(id){if(S.demo)return demoFor(id);const e=EX[id];return S.hist.filter(h=>h.date&&h.reps&&h.reps[id]).map(h=>{const r=h.reps[id],sl=(h.sl||{})[id]||[],lg=(h.log||[]).filter(g=>g.id==id),sets=r.map((x,i)=>({reps:x,w:e.bw?0:((sl[i]&&sl[i].w)||0),e:lg[i]?lg[i].effort:''}));return{date:new Date(h.date),vol:e.bw?sets.reduce((t,x)=>t+x.reps,0):(h.ex&&h.ex[id])||sets.reduce((t,x)=>t+x.reps*x.w,0),sets}}).sort((a,b)=>a.date-b.date)}
function withPR(id,ss){const bw=EX[id].bw;let best=0;return ss.map(x=>{let pr=false;x.sets.forEach(t=>{const sc=bw?t.reps:t.w*t.reps;if(sc>best){if(best>0)pr=true;best=sc}});return{...x,pr}})}
const niceStep=r=>{const p=Math.pow(10,Math.floor(Math.log10(r||1))),f=r/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p};
function chart(pts,unit){if(!pts.length)return `<p class="mut empty">No workouts in this range.</p>`;
const W=360,H=210,L=40,R=16,T=12,B=30,max=Math.max(...pts.map(p=>p.vol)),step=niceStep(max/4),top=Math.max(step,Math.ceil(max/step)*step),x0=+pts[0].date,x1=+pts[pts.length-1].date,cw=W-L-R;
const xs=d=>x1==x0?L+cw/2:L+((+d-x0)/(x1-x0))*cw,ys=v=>T+(1-v/top)*(H-T-B);
let g='';for(let v=0;v<=top+0.001;v+=step)g+=`<line class="gr" x1="${L}" x2="${W-R}" y1="${ys(v).toFixed(1)}" y2="${ys(v).toFixed(1)}"/><text x="${L-8}" y="${(ys(v)+4).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
const path=pts.map((p,i)=>(i?'L':'M')+xs(p.date).toFixed(1)+' '+ys(p.vol).toFixed(1)).join(' ');
const dots=pts.map(p=>`<circle class="pt" cx="${xs(p.date).toFixed(1)}" cy="${ys(p.vol).toFixed(1)}" r="3.6"/>`).join('');
const lab=[[pts[0],'start',x1==x0?'middle':'start']];if(x1!=x0)lab.push([pts[pts.length-1],'end','end']);if(pts.length>=3){const m=pts[Math.floor(pts.length/2)];if(+m.date>x0+(x1-x0)*0.25&&+m.date<x1-(x1-x0)*0.25)lab.push([m,'mid','middle'])}
const xl=lab.map(([p,k,a])=>`<text x="${(k=='start'&&x1!=x0?L:k=='end'?W-R:xs(p.date)).toFixed(1)}" y="${H-8}" text-anchor="${a}">${fmtMD(p.date)}</text>`).join('');
return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit} per session, from ${Math.round(pts[0].vol)} on ${fmtMD(pts[0].date)} to ${Math.round(pts[pts.length-1].vol)} on ${fmtMD(pts[pts.length-1].date)}">${g}<path class="ln" d="${path}"/>${dots}${xl}</svg>`}
function openEx(id){S.pe=id;go('ex')}
function vProg(){const inPlan=new Set(wkSeq().flatMap(l=>build(l).items.map(i=>i.id)));const ids=Object.keys(EX).filter(id=>(!S.demo||inPlan.has(id))&&histFor(id).length);
const demoNote=S.demo?`<div class="note">Sample data, not your workouts. <button class="chip" style="min-height:36px;margin-left:6px" onclick="S.demo=false;render()">Turn off</button></div>`:'';
return `<h1>Progress</h1><p class="mut">Volume per session for each exercise you have logged.</p>${demoNote}
${ids.length?`<div style="margin-top:16px">${ids.map(id=>{const h=histFor(id),last=h[h.length-1],e=EX[id];return `<button class="li" onclick="openEx('${id}')"><span>${e.n}<small>${h.length} session${h.length==1?'':'s'}, last ${Math.round(last.vol)} ${e.bw?'reps':'kg'}</small></span><svg viewBox="0 0 24 24" aria-hidden="true">${IC.go}</svg></button>`}).join('')}</div>`:`<p class="mut empty">No workouts logged yet. Finish a workout and your progress shows up here.</p><button class="btn alt" onclick="S.demo=true;render()">Preview with sample data</button>`}`}
function vEx(){const id=S.pe,e=EX[id];if(!e)return vProg();const all=withPR(id,histFor(id)),rg=RANGES.find(r=>r[0]==S.pr)||RANGES[2],cut=rg[1]?Date.now()-rg[1]*864e5:0,pts=all.filter(x=>+x.date>=cut),unit=e.bw?'Reps':'Volume (kg)';
const top=x=>x.sets.reduce((b,t)=>(e.bw?t.reps:t.w*t.reps)>=(e.bw?b.reps:b.w*b.reps)?t:b,x.sets[0]);
const recent=[...all].reverse().slice(0,8).map(x=>{const t=top(x);return `<div class="rs"><span class="d">${fmtMD(x.date)}</span><span>${e.bw?t.reps+' reps':t.w+' kg × '+t.reps}${t.e&&t.e!='just right'?` <small>${t.e}</small>`:''}</span>${x.pr?'<span class="prb">PR</span>':'<span></span>'}</div>`}).join('');
return `${S.demo?`<div class="note">Sample data, not your workouts.</div>`:''}<div class="eh"><button class="ib" onclick="go('prog')" aria-label="Back to progress"><svg viewBox="0 0 24 24" aria-hidden="true">${IC.back}</svg></button><h1>${e.n}</h1><span></span></div>
<div class="tabs" role="tablist" aria-label="Time range">${RANGES.map(r=>`<button class="tab ${rg[0]==r[0]?'on':''}" role="tab" aria-selected="${rg[0]==r[0]}" onclick="S.pr='${r[0]}';render()">${r[0]}</button>`).join('')}</div>
<div class="ch"><h2>${e.bw?'Reps per session':'Volume per session'}</h2><p class="mut">${rg[2]}${e.bw?'':', sets × reps × weight'}</p>${chart(pts,e.bw?'Reps':'Volume in kilograms')}</div>
<h2>Recent sets</h2><p class="mut" style="margin-top:0">Best set from each workout</p>${recent||'<p class="mut empty">No sets yet.</p>'}`}
const MUL=Object.fromEntries(MU),SHORT={chest:'chest',shoulders:'shoulders',reardelts:'rear delts',lats:'back',biceps:'biceps',triceps:'triceps',quads:'quads',hams:'hamstrings',glutes:'glutes',abs:'abs'};
const PPL=['M:chest,shoulders,triceps','M:lats,reardelts,biceps','M:quads,hams,glutes,abs'],BRO=['M:chest,triceps','M:lats,biceps','M:quads,hams,glutes','M:shoulders,reardelts,abs'];
const PN={'M:chest,shoulders,triceps':'Push','M:lats,reardelts,biceps':'Pull','M:quads,hams,glutes,abs':'Legs','M:chest,triceps':'Chest and triceps','M:lats,biceps':'Back and biceps','M:quads,hams,glutes':'Legs','M:shoulders,reardelts,abs':'Shoulders and abs'};
const DEFC=[['chest','triceps'],['lats','reardelts','biceps'],['quads','hams','glutes'],['shoulders','abs'],['chest','lats'],['quads','glutes'],['abs']];
const PREF={chest:[['bench','floor'],['incl','ipush'],['fly','ffly','ifly'],['pushup'],['wpush']],shoulders:[['ohp','pike'],['lat'],['arn'],['frt']],reardelts:[['rfly','brfly'],['yr']],lats:[['row','brow'],['crow','brow'],['pull'],['snow']],biceps:[['curl'],['hammer'],['icurl']],triceps:[['tri'],['skull','kick'],['cpush'],['bdip']],quads:[['goblet','bsq'],['split','rlunge','blunge'],['stepup'],['sumo']],hams:[['rdl','gm'],['hcurl'],['srdl'],['hwalk']],glutes:[['whthrust','hthrust','wbridge','bridge'],['sbridge'],['donkey'],['hydrant']],abs:[['dead','bird'],['crunch','rcrunch'],['rtwist','mclimb'],['sbend']]};
const SMALLM=['shoulders','reardelts','biceps','triceps','abs'],TGT={beginner:[9,6],intermediate:[13,9],advanced:[16,12]};
const BIG=['chest','lats','quads','hams','glutes','shoulders'];
function mname(l){l=l.split('#')[0];if(PN[l])return PN[l];const a=l.slice(2).split(',').filter(Boolean).map(k=>SHORT[k]||k);if(!a.length)return 'Empty day';const t=a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0];return t[0].toUpperCase()+t.slice(1)}
function occ(a){const c={};return a.map(l=>{if(!l.startsWith('M:'))return l;const n=c[l]||0;c[l]=n+1;return n?l+'#'+n:l})}
function wkSeq(){const d=S.days,sp=S.split||'auto',cyc=a=>occ(Array.from({length:d},(_,i)=>a[i%a.length]));
if(sp=='full')return cyc(['A','B']);if(sp=='ul')return cyc(['U1','L1','U2','L2']);if(sp=='ppl')return cyc(PPL);if(sp=='bro')return cyc(BRO);
if(sp=='custom'){ensureCustom();return occ(Array.from({length:d},(_,i)=>'M:'+S.custom[i].join(',')))}
return WEEK[d]}
function ensureCustom(){if(!S.custom)S.custom=[];for(let i=0;i<7;i++)if(!S.custom[i])S.custom[i]=DEFC[i].slice()}
function mfreq(m){let f=0;wkSeq().forEach(l=>{if(l.startsWith('M:')&&l.slice(2).split('#')[0].split(',').includes(m))f++});return Math.max(1,f)}
function buildM(lab){const [base,oc]=lab.slice(2).split('#'),k=+oc||0,ms=base.split(',').filter(Boolean).sort((a,b)=>BIG.includes(b)-BIG.includes(a)),items=[],miss=[],cap=S.lvl=='advanced'||S.lvl=='intermediate'?7:6,T=TGT[S.lvl]||TGT.beginner,cnt={};
ms.forEach(m=>{cnt[m]=Math.max(1,Math.round(T[SMALLM.includes(m)?1:0]/mfreq(m)/3))});
const tot=()=>ms.reduce((a,m)=>a+cnt[m],0);
while(tot()>cap){const mx=Math.max(...ms.map(m=>cnt[m]));if(mx<=1)break;const m=[...ms].reverse().find(x=>cnt[x]==mx);cnt[m]--}
ms.forEach(m=>{const g=PREF[m]||[],r=g.length?k%g.length:0,groups=g.slice(r).concat(g.slice(0,r));let got=0;
for(const grp of groups){if(got>=cnt[m])break;const id=grp.find(id=>!S.skip.includes(id)&&EX[id].need.every(has)&&!items.some(x=>x.id==id));if(id){items.push({p:MUL[m],id});got++}}
if(!got)miss.push(MUL[m])});
return{lab,items:items.slice(0,cap),miss}}
function setSplit(k){S.split=k;if(k=='custom')ensureCustom();render()}
function cm(i,k){ensureCustom();const a=S.custom[i],j=a.indexOf(k);if(j<0)a.push(k);else a.splice(j,1);render()}
const SPN={full:'Every session trains the whole body. Works well for 2 to 3 days a week.',ul:'Alternates upper body and lower body sessions.',ppl:'Push (chest, shoulders, triceps), pull (back, rear delts, biceps) and legs. Fits 3 or 6 days a week best.',bro:'One or two muscle groups a day: chest and triceps, back and biceps, legs, then shoulders and abs.',custom:'Choose the muscles for each training day. The plan picks exercises from your equipment.'};
function splitUI(){const sp=S.split||'auto',opts=[['auto','Auto'],['full','Full body'],['ul','Upper / lower'],['ppl','Push / pull / legs'],['bro','Body-part'],['custom','Choose my own']];
let h=`<h2>Training split</h2><div class="chips">${opts.map(([k,l])=>`<button class="chip ${sp==k?'on':''}" aria-pressed="${sp==k}" onclick="setSplit('${k}')">${l}</button>`).join('')}</div><p class="mut">${sp=='auto'?'Recommended for beginners. '+DNOTE[S.days]:SPN[sp]}</p>`;
if(sp=='custom'){ensureCustom();const cnt={};for(let i=0;i<S.days;i++)S.custom[i].forEach(k=>cnt[k]=(cnt[k]||0)+1);
h+=Array.from({length:S.days},(_,i)=>`<div class="cd"><b>${DN[DI[S.days][i]]}</b><div class="chips">${MU.map(([k,l])=>`<button class="chip sm ${S.custom[i].includes(k)?'on':''}" aria-pressed="${S.custom[i].includes(k)}" onclick="cm(${i},'${k}')">${l}</button>`).join('')}</div></div>`).join('');
const none=MU.filter(([k])=>!cnt[k]).map(([,l])=>l.toLowerCase()),once=MU.filter(([k])=>cnt[k]==1).map(([,l])=>l.toLowerCase());
h+=`<p class="mut">${none.length?`Not trained this week: ${none.join(', ')}. `:'Every major muscle is trained. '}${once.length&&S.days>1?`Trained once: ${once.join(', ')}. Twice a week usually works better for beginners.`:''}</p>`}
return h}
function vHow(){return `<h1>How your plan adapts</h1><p class="mut">Plain rules, so you always know why a number changed.</p>
<div class="card how"><ul>
<li><b>Built from your equipment.</b> Only exercises you can do with your bench, dumbbells and bodyweight appear. Anything you said you can’t do is left out.</li>
<li><b>Set by set.</b> Hit your reps and call it easy, and the next set goes up a rep, then a heavier dumbbell. Miss the target and the next set stays the same.</li>
<li><b>Workout by workout.</b> Finish the expected volume (sets × reps × weight) and next time aims for about 10% more. Fall short and you repeat the same plan.</li>
<li><b>Pain stops an exercise.</b> Say or tap that it hurt, and it is removed from your plan. Check with a doctor or physio before trying it again.</li>
</ul></div>
<p class="mut">RepPal is a training log, not medical advice.</p>
<button class="btn" onclick="nav('${S.started?'week':'setup'}')">${S.started?'Back to your week':'Set up your plan'}</button>`}
function render(){$('#app').innerHTML={setup:vSetup,week:vWeek,plan:vPlan,log:vLog,done:vDone,profile:vProfile,how:vHow,auth:vAuth,prog:vProg,ex:vEx}[S.v]();chrome();applyTheme();const t=$('#t');if(t)t.value=S.last||'';save()}
if(document.addEventListener)document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.menu)menu(false)});
